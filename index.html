<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <img src="/img/amazon-logo-white.png" alt="Amazon icon" />
      <input type="text" class="search__bar" placeholder="Search" />
      <button class="search__btn">
        <img src="/img/icons/search-icon.png" alt="Search icon" />
      </button>
      <p class="orders">Returns & Orders</p>
      <div class="cart">
        <img src="" alt="Shopping cart" />
        <p class="cart">Cart</p>
      </div>
    </nav>
    <div class="items__list">
      <div class="item__container"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
