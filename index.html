<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <img src="/img/amazon-logo-white.png" alt="Amazon icon" />
      <input type="text" class="search__bar" placeholder="Search" />
      <button class="search__btn">
        <img src="/img/icons/search-icon.png" alt="Search icon" />
      </button>
      <p class="orders">Returns & Orders</p>
      <div class="cart">
        <img src="" alt="Shopping cart" />
        <p class="cart">Cart</p>
      </div>
    </nav>
    <div class="items__list">
      <div class="item__container">
        <img
          src="/img/products/men-cozy-fleece-zip-up-hoodie-red.jpg"
          alt="Red Sweatshirt Hoodie"
          class="item__photo"
        />
        <p class="item__name">Men's Full-Zip Hooded Fleece Sweatshirt</p>
        <img
          src="/img/ratings/rating-45.png"
          alt="4.5 Rating"
          class="item__rating-stars"
        />
        <p class="item__rating">3157</p>
        <p class="item__price">$ 24.00</p>
        <!-- <select class="item__quantity">
          <option selected value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select> -->
        <button class="addCart">Add to Cart</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
