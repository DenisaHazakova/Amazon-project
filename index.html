<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="#" class="amazon__logo-link"
        ><img
          src="/img/amazon-logo-white.png"
          alt="Amazon icon"
          class="amazon__logo"
      /></a>
      <div class="searchbar">
        <input type="text" class="search__input" placeholder="Search" />
        <button type="submit" class="search__btn">
          <img
            src="/img/icons/search-icon.png"
            alt="Search icon"
            class="search-icon"
          />
        </button>
      </div>
      <div class="returns-orders">
        <a href="#" class="returns-orders__text">
          <span class="returns">Returns</span>
          <span class="orders">& Orders</span>
        </a>
        <a href="#" class="cart"
          ><img
            src="/img/icons/cart-icon.png"
            alt="Shopping cart"
            class="shopping-cart-icon"
          />
          <p class="cartText">Cart</p></a
        >
      </div>
    </nav>
    <div class="items__list"></div>
    <script src="script.js"></script>
  </body>
</html>
