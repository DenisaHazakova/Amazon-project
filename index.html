<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <img
        src="/img/amazon-logo-white.png"
        alt="Amazon icon"
        class="amazon__logo"
      />
      <div class="searchbar">
        <input type="text" class="search__input" placeholder="Search" />
        <button type="submit" class="search__btn">
          <img
            src="/img/icons/search-icon.png"
            alt="Search icon"
            class="search-icon"
          />
        </button>
      </div>
      <div class="returns-orders">
        <div class="returns-orders__text">
          <p class="returns">Returns</p>
          <p class="orders">& Orders</p>
        </div>

        <div class="cart">
          <img
            src="/img/icons/cart-icon.png"
            alt="Shopping cart"
            class="shopping-cart-icon"
          />
          <p class="cartText">Cart</p>
        </div>
      </div>
    </nav>
    <div class="items__list"></div>
    <script src="script.js"></script>
  </body>
</html>
