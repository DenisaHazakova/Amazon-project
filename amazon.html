<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Amazon store</title>
    <link rel="stylesheet" href="/styles/amazon.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="#" class="amazon__logo-link"
        ><img
          src="/img/amazon-logo-white.png"
          alt="Amazon icon"
          class="amazon__logo"
      /></a>
      <div class="searchbar">
        <input type="text" class="search__input" placeholder="Search" />
        <button type="submit" class="search__btn">
          <img
            src="/img/icons/search-icon.png"
            alt="Search icon"
            class="search-icon"
          />
        </button>
      </div>
      <div class="returns-orders">
        <a href="#" class="returns-orders__text">
          <span class="returns">Returns</span>
          <span class="orders">& Orders</span>
        </a>
        <a href="checkout.html" class="cart">
          <img
            src="/img/icons/cart-icon.png"
            alt="Shopping cart"
            class="shopping-cart-icon"
          />
          <div class="cart__quantity">0</div>
          <p class="cartText">Cart</p>
        </a>
      </div>
    </nav>
    <div class="items__list"></div>
    <!-- type module says: "let's this file get variables out of other files" -->
    <script type="module" src="/scripts/script.js"></script>
  </body>
</html>
